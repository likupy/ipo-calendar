name: 공모주 데이터 갱신

on:
  schedule:
    - cron: "*/30 0-11 * * 1-5"
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ipo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install holidays
      - name: DART 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collector/collect.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add docs/data/ipo.json
          if git diff --cached --quiet -- docs/data/ipo.json; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%m/%d %H:%M')"
            git push
          fi
