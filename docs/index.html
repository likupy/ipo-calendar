<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FD6">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="공모주">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>공모주 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: Mon–Fri month grid (the way the blogger's sheet reads), colored chips per event type,
   broker filter above, details in a bottom sheet. Phone and desktop share the same grid; only type size changes. */
:root {
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --out: #FAFBFC;
  --ink: #141A22;
  --ink-2: #596372;
  --line: #DFE4EB;
  --today: #EDF1F7;
  --sub-bg: #B6D8F2; --sub-fg: #0F3157;
  --ref-bg: #E6E9EE; --ref-fg: #29313D;
  --lst-bg: #FFD196; --lst-fg: #5A3000;
  --spc-bg: #C2EDDD; --spc-fg: #0B4A3A;
  --up: #B01E13;
  --down: #1743B5;
  --dot: #E5362B;
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #161B22; --out: #12171D; --ink: #E7EAEE; --ink-2: #98A2B0; --line: #262D37; --today: #1E2630;
    --sub-bg: #1B3350; --sub-fg: #B6D8F2;
    --ref-bg: #252B34; --ref-fg: #B7BFCB;
    --lst-bg: #4A3515; --lst-fg: #FFD196;
    --spc-bg: #1B4237; --spc-fg: #C2EDDD;
    --up: #FF8A7D; --down: #86B1FF; --dot: #FF6B5E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #161B22; --out: #12171D; --ink: #E7EAEE; --ink-2: #98A2B0; --line: #262D37; --today: #1E2630;
  --sub-bg: #1B3350; --sub-fg: #B6D8F2;
  --ref-bg: #252B34; --ref-fg: #B7BFCB;
  --lst-bg: #4A3515; --lst-fg: #FFD196;
  --spc-bg: #1B4237; --spc-fg: #C2EDDD;
  --up: #FF8A7D; --down: #86B1FF; --dot: #FF6B5E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px;
}
button { font-family: inherit; }

/* The page is drawn once at PC size (900px wide) and scaled as a whole to fit the window. */
#stage { margin: 0 auto; width: 900px; overflow: hidden; }
.wrap { width: 900px; transform-origin: 0 0; }

/* header */
.top { display: flex; align-items: center; gap: 14px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.monthbar { display: flex; align-items: center; gap: 6px; }
h2 { margin: 0; font-size: 17px; font-weight: 700; min-width: 7.2em; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nav, .todaybtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1;
}
.nav { width: 32px; }
.todaybtn { padding: 0 12px; font-size: 13px; font-weight: 500; margin-left: 4px; }
.meta { margin-left: auto; text-align: right; }
.sum { margin: 0; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.stamp { display: block; font-size: 11px; color: var(--ink-2); }
:is(.nav, .todaybtn, .pill, .chip, .key, #sheetClose):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* type toggles + brokers */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; margin: 12px 0 10px; }
.legend { display: flex; gap: 6px; }
.key { display: inline-flex; gap: 5px; align-items: center; min-height: 30px; padding: 0 11px; border: 0; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--c-bg); color: var(--c-fg); }
.key b { opacity: .65; }
.key[aria-pressed="false"] { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.key[aria-pressed="false"] b { opacity: 1; text-decoration: none; }
.brokers { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.pill b { margin-left: 4px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pill[aria-pressed="true"] b { color: inherit; }

/* calendar */
.k-sub { --c-bg: var(--sub-bg); --c-fg: var(--sub-fg); }
.k-ref { --c-bg: var(--ref-bg); --c-fg: var(--ref-fg); }
.k-lst { --c-bg: var(--lst-bg); --c-fg: var(--lst-fg); }
.k-spc { --c-bg: var(--spc-bg); --c-fg: var(--spc-fg); }

.cal { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.dow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); }
.dow span { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 5px 0; }
/* a week box is at least 5 text lines tall; a bar row holds 3 lines of text */
.week {
  --nm: 12px; --me: 11px; --lh: 1.25; --row: 49px;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 1px;
  min-height: calc(22px + 5 * var(--nm) * var(--lh)); border-top: 1px solid var(--line);
}
.cb { background: var(--surface); }
.cb:not(:first-child) { border-left: 1px solid var(--line); }
.cb.out { background: var(--out); }
.cb.today { background: var(--today); }
.dn { grid-row: 1; justify-self: end; padding: 2px 7px 1px; font-size: 11px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dn.out { opacity: .75; }
.dn.today b { background: var(--ink); color: var(--surface); border-radius: 99px; min-width: 19px; text-align: center; padding: 0 5px; font-weight: 600; display: inline-block; }

.chip {
  display: flex; flex-direction: column; justify-content: flex-start; min-width: 0; overflow: hidden;
  margin: 0; padding: 3px 8px 2px; text-align: left; border: 0; border-radius: 0; cursor: pointer;
  justify-self: stretch; align-self: stretch;
  background: var(--c-bg); color: var(--c-fg);
  box-shadow: inset 1px 0 0 var(--surface), inset -1px 0 0 var(--surface);
  word-break: keep-all; overflow-wrap: anywhere;
}
.chip.wd { opacity: .5; }
.chip.wd .nm { text-decoration: line-through; }
.nm { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--nl, 1); overflow: hidden; font-size: var(--nm); line-height: var(--lh); font-weight: 600; }
.sub2 .nm { font-weight: 500; }
.tag { font-weight: 700; margin-right: 3px; opacity: .65; }
.ln, .px { display: block; font-size: var(--me); line-height: var(--lh); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln { opacity: .82; }
.px { font-variant-numeric: tabular-nums; }
.px.band { font-weight: 500; opacity: .88; }
.px.fix { font-weight: 700; }
.up { color: var(--up); }
.down { color: var(--down); }
.chip.dim { opacity: .18; }

.foot { margin: 10px 0 0; font-size: 11px; color: var(--ink-2); line-height: 1.5; }

/* Phone layout (window narrower than 700px): controls stay at real size so they are easy to tap,
   and only the calendar is scaled to fit the screen, edge to edge. */
.stamp2 { display: none; }
#calscale { transform-origin: 0 0; }
#tail { height: 0; }
html.mob #below .foot { margin-top: 6px; }
html.mob body { padding-block: 22px 10px; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
html.mob #stage { width: auto !important; height: auto !important; overflow: visible; margin: 0; }
html.mob .wrap { width: auto; transform: none !important; display: flow-root; }
html.mob h1, html.mob .meta { display: none; }
html.mob .top { position: relative; padding: 0 10px; }
html.mob .bell { position: absolute; right: 10px; top: 50%; margin: 0; transform: translateY(-50%); width: 28px; height: 25px; border-radius: 6px; }
html.mob .bell svg { width: 15px; height: 15px; }
html.mob .bell .dot { top: 3px; right: 4px; width: 7px; height: 7px; }
html.mob .monthbar { width: 100%; justify-content: center; gap: 8px; }
html.mob h2 { font-size: 16px; min-width: 6.4em; }
html.mob .nav { width: 28px; height: 25px; font-size: 16px; border-radius: 6px; }
html.mob .todaybtn { height: 25px; padding: 0 11px; font-size: 11px; margin-left: 4px; border-radius: 6px; }
html.mob .tools { display: block; margin: 10px 0 9px; padding: 0 10px; }
html.mob .legend { display: flex; justify-content: flex-start; flex-wrap: nowrap; gap: 5px; }
html.mob .key { min-height: 23px; padding: 0 9px; justify-content: center; gap: 3px; font-size: 11px; line-height: 1; white-space: nowrap; border-radius: 5px; }
html.mob .brokers { margin-top: 7px; flex-wrap: nowrap; gap: 5px; }
html.mob .lbl { flex: none; font-size: 10.5px; margin-right: 1px; }
html.mob .pills { flex: 1; min-width: 0; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -10px; padding-right: 10px; }
html.mob .pills::-webkit-scrollbar { display: none; }
html.mob .pill { flex: none; min-height: 19px; padding: 0 6px; font-size: 10.5px; line-height: 1; }
html.mob .pill b { margin-left: 3px; }
html.mob #calstage { overflow: hidden; }
html.mob .cal { border-left: 0; border-right: 0; border-radius: 0; }
html.mob .foot { margin-top: 6px; padding: 0 10px; font-size: 7.5px; line-height: 1.3; }
html.mob .f1 { display: none; }
html.mob .stamp2 { display: block; }

/* Short phone screens: bars switch to the blogger's two-line form (name + broker, then price)
   so the calendar text can stay at least as large as the blogger's without scrolling. */
html.mob.compact .week { --row: 38px; }
html.mob.compact body { padding-block: 8px 6px; }
html.mob.compact .tools { margin: 10px 0 8px; }
html.mob.compact .brokers { margin-top: 8px; }
html.mob.compact .foot { margin-top: 6px; }
html.mob.compact .chip { display: grid; grid-template-columns: minmax(0, auto) max-content 1fr; align-content: start; align-items: baseline; column-gap: 4px; }
html.mob.compact .nm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; max-width: 100%; }
html.mob.compact .ln { flex: none; }
html.mob.compact .px { grid-column: 1 / -1; }
@media (prefers-reduced-motion: no-preference) {
  #weeks.in-l { animation: inL .22s ease-out; }
  #weeks.in-r { animation: inR .22s ease-out; }
  @keyframes inL { from { opacity: 0; transform: translateX(28px); } }
  @keyframes inR { from { opacity: 0; transform: translateX(-28px); } }
}

/* Phone: calendar text is heavier, fully opaque and a touch larger so it stays readable when scaled down. */
html.mob .week { --nm: 12.5px; --me: 11.5px; --row: 53px; }
html.mob .nm { font-weight: 700; }
html.mob .sub2 .nm { font-weight: 600; }
html.mob .tag { opacity: .9; }
html.mob .ln { opacity: 1; font-weight: 500; }
html.mob .px.band { opacity: 1; font-weight: 600; }
html.mob .chip { -webkit-text-stroke: 0.2px currentColor; padding: 4px 8px; }
html.mob .dn { color: var(--ink); font-weight: 600; font-size: 11.5px; }
html.mob .dow span { color: var(--ink); font-weight: 700; }

/* detail sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 18, .5); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px;
  background: var(--surface); color: var(--ink);
  border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
  padding-top: 18px;
  padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
@media (min-width: 640px) {
  .sheet { bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 16px; padding-bottom: 22px; }
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: sticky; top: -18px; z-index: 3; background: var(--surface); margin: -18px -18px 0; padding: 18px 18px 8px; }
.sheet h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
.badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; vertical-align: 2px; background: var(--spc-bg); color: var(--spc-fg); }
#sheetClose { flex: none; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font-size: 15px; }
.kv { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 12px 12px; margin: 16px 0 0; }
.kv dt { color: var(--ink-2); font-size: 13px; font-weight: 500; padding-top: 1px; }
.kv dd { margin: 0; font-size: 14.5px; }
.kv .big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
/* alerts */
.bell { position: relative; flex: none; width: 32px; height: 32px; margin-left: 10px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; }
.bell svg { width: 17px; height: 17px; }
.bell .dot { position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 2px var(--surface); }
:is(.bell, #notiClose, .tab, .nitem):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.noti { display: flex; flex-direction: column; max-height: min(78vh, 640px); }
#notiClose { flex: none; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font-size: 15px; }
.tabs { display: flex; margin: 14px 0 0; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 9px 0 10px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tdot { display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--dot); vertical-align: 2px; }
.nlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.nitem { display: block; width: 100%; padding: 12px 2px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font: inherit; cursor: pointer; }
.nitem.static { cursor: default; }
.nitem .nt { display: block; font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nitem.unseen .nt::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--dot); vertical-align: 1px; }
.nitem .nn { font-size: 14.5px; font-weight: 700; }
.nitem .nx { display: block; margin-top: 2px; font-size: 14px; }
.nempty { padding: 30px 4px; text-align: center; color: var(--ink-2); font-size: 13.5px; }
.sheet:not(.noti) { max-height: 95vh; overflow-y: auto; overscroll-behavior: contain; }
.grab { display: none; }
@media (max-width: 639px) {
  #sheet .grab { display: block; position: absolute; top: 7px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--ink-2); opacity: .4; }
}
.sheet:not(.noti)::-webkit-scrollbar { width: 12px; }
.sheet:not(.noti)::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
.sheet:not(.noti)::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
.sheet:not(.noti)::-webkit-scrollbar-button { display: none; }
@supports (-moz-appearance: none) { .sheet:not(.noti) { scrollbar-width: thin; scrollbar-color: var(--line) transparent; } }
@media (min-width: 640px) { .sheet:not(.noti) { max-height: 70vh; } }
#sheet.snap { transition: height .24s ease, transform .24s ease; }
.sec { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
.sec h4 { margin: 0 0 10px; font-size: 13px; font-weight: 700; }
.bk { margin: 0 0 12px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--out); }
.bk .bn { font-size: 14.5px; font-weight: 700; margin-bottom: 8px; }
.bk dl { display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 7px 10px; margin: 0; }
.bk dt { color: var(--ink-2); font-size: 12.5px; }
.bk dd { margin: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.bk dd b { font-size: 15px; }
.bk dd .sh { margin-left: 6px; color: var(--ink-2); font-size: 12px; }
.sec .note { margin: 12px 0 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.5; }
.kv small { display: block; margin-top: 2px; color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* 새 상세창 (일부 종목) */
.xph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.xph .k { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.xph .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.xph .v.none { font-size: 15px; color: var(--ink-2); font-weight: 600; }
.xex { margin: 4px 0 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.xtl { margin: 16px 0 0 8px; padding-left: 20px; border-left: 2px solid var(--line); }
.xst { position: relative; padding-bottom: 16px; }
.xst:last-child { padding-bottom: 0; }
.xst::before { content: ''; position: absolute; box-sizing: border-box; left: -27px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); }
.xst.on::before { background: var(--down); border-color: var(--down); }
.xst.wait::before { border-style: dashed; opacity: .6; }
.xst .h { font-size: 13px; font-weight: 700; }
.xst .h small { margin-left: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); }
.xst .w { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.xm { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.xm div:nth-child(odd) { color: var(--ink-2); }
.xm div:nth-child(even) { text-align: right; font-weight: 700; }
.xm .nw { color: var(--down); }
.xcd { margin-top: 10px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; }
.xcd .lb { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.xcd .bg { margin-top: 4px; font-size: 26px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.xcd .bg small { margin-left: 2px; font-size: 14px; font-weight: 600; }
.xcd .chg { display: inline-flex; gap: 5px; align-items: center; margin-top: 8px; padding: 5px 9px; border-radius: 8px; background: var(--today); font-size: 12px; color: var(--ink-2); }
.xcd .chg b { color: var(--ink); }
.xcd .ex { margin-top: 8px; font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.xcd .bg.none { font-size: 18px; color: var(--ink-2); }
.xcd .wt { margin-top: 8px; font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.xfin .t, .xpx .t { margin-top: 8px; font-size: 11.5px; color: var(--ink-2); }
.xpx table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.xpx th { padding: 0 0 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); text-align: right; }
.xpx th:first-child { text-align: left; }
.xpx td { padding: 11px 0; border-top: 1px solid var(--line); text-align: right; font-size: 14.5px; font-weight: 700; }
.xpx td:first-child { text-align: left; font-size: 13.5px; font-weight: 500; }
.xpx tr:last-child td { border-bottom: 1px solid var(--line); }
.xpx .pu { color: var(--up); } .xpx .pd { color: var(--down); }
.xpx .big2 { display: grid; grid-template-columns: 1fr 1fr; }

<script>
(function () {
  'use strict';

  /* Sample data transcribed from the blogger's November 2026 calendar (as of 10/31).
     Later this object is replaced by the collector's ipo.json.
     price = confirmed offer price (null until confirmed), band = hoped-for range [low, high],
     tone = 'up' (at/above band top) or 'down' (at/below band bottom). */
  const D = s => '2026-' + s;
  let DATA = {
    updatedAt: '2026-10-31',
    ipos: [
      { id: 'yk',   name: '영광', brokers: ['한국'], price: 17000, tone: 'up', listing: D('11-02') },
      { id: 'rb',   name: '래블업', brokers: ['NH'], price: 19000, tone: 'down', listing: D('11-03') },
      { id: 'est',  name: '이에스티', brokers: ['대신'], price: 12400, tone: 'up', listing: D('11-04') },
      { id: 'imsp', name: '아이엠스팩1호', brokers: [], spac: true, listing: D('11-04') },
      { id: 'dwp',  name: '동원파츠', brokers: ['삼성'], band: [23000, 26500], price: 27500, tone: 'up', sub: [D('11-02'), D('11-03')], refund: D('11-05'), listing: D('11-10') },
      { id: 'brp',  name: '바로팜', brokers: ['미래'], band: [16400, 20200], price: 16400, tone: 'down', sub: [D('11-02'), D('11-03')], refund: D('11-05'), listing: D('11-11') },
      { id: 'nxi',  name: '넥스아이', brokers: ['한국'], band: [10500, 13000], price: 8000, tone: 'down', sub: [D('11-03'), D('11-04')], refund: D('11-06'), listing: D('11-12') },
      { id: 'ykmc', name: '영광와이케이엠씨', brokers: ['대신'], band: [9400, 11000], sub: [D('11-04'), D('11-05')], refund: D('11-09') },
      { id: 'opt',  name: '옵토닉스', brokers: ['한국'], band: [10000, 12000], price: 12000, tone: 'up', sub: [D('11-05'), D('11-06')], refund: D('11-10'), listing: D('11-16') },
      { id: 'alr',  name: '에이엘로봇', brokers: ['대신'], band: [15700, 17600], sub: [D('11-06'), D('11-09')], refund: D('11-11') },
      { id: 'hana', name: '하나에어로다이내믹스', brokers: ['IBK'], band: [4700, 5700], sub: [D('11-10'), D('11-11')], refund: D('11-13') },
      { id: 'cnm',  name: '씨앤엠', brokers: ['한국'], band: [10000, 13000], sub: [D('11-12'), D('11-13')], refund: D('11-17') },
      { id: 'mbd',  name: '엠비디', brokers: ['하나'], band: [9400, 11500], sub: [D('11-12'), D('11-13')], refund: D('11-17') },
      { id: 'jnt',  name: '제이앤티지', brokers: ['대신', 'NH'], band: [26400, 31900], sub: [D('11-12'), D('11-13')], refund: D('11-17') },
      { id: 'dbo',  name: '다비오', brokers: ['대신'], refund: D('11-13') },
      { id: 'sfc',  name: '에스에프씨', brokers: ['미래', '한국', '삼성'], band: [31600, 36100], sub: [D('11-18'), D('11-19')], refund: D('11-24') },
      { id: 'uct',  name: '유캐스트', brokers: ['유진', '신영'], band: [19000, 23000], sub: [D('11-18'), D('11-19')], refund: D('11-24') },
      { id: 'adl',  name: '아델', brokers: ['삼성', '미래'], band: [18000, 25000], sub: [D('11-23'), D('11-24')], refund: D('11-26') },
      { id: 'kmf',  name: '케이엠에프', brokers: ['IBK'], band: [15000, 17800], sub: [D('11-24'), D('11-25')], refund: D('11-27') },
      { id: 'znn',  name: '제논', brokers: ['삼성'], band: [9700, 12200], sub: [D('11-24'), D('11-25')], refund: D('11-27') },
      { id: 'shs',  name: '신영해피투모로우제12호스팩', brokers: ['신영'], spac: true, sub: [D('11-24'), D('11-25')], refund: D('11-27') },
      { id: 'anh',  name: '에이엔에이치스트럭쳐', brokers: ['NH'], band: [11200, 13600], sub: [D('11-27'), D('11-30')], refund: D('12-02') }
    ]
  };

  const DAY = 86400000;
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmt = n => Number(n).toLocaleString('en-US');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ts = s => { const a = s.split('-').map(Number); return Date.UTC(a[0], a[1] - 1, a[2]); };
  const parts = t => { const x = new Date(t); return { y: x.getUTCFullYear(), m: x.getUTCMonth() + 1, d: x.getUTCDate(), w: x.getUTCDay() }; };
  const isoOf = t => { const p = parts(t); return p.y + '-' + pad(p.m) + '-' + pad(p.d); };
  const kstToday = () => { const t = new Date(Date.now() + 9 * 3600 * 1000); return Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
  const longDate = s => { const p = parts(ts(s)); return p.m + '월 ' + p.d + '일 (' + WD[p.w] + ')'; };
  const ymOf = s => s.slice(0, 7);

  /* ---- events by date ---- */
  let EVENTS = {};
  let byId = {};
  let dataMonths = [];
  function rebuild() {
    EVENTS = {}; byId = {};
    const add = (date, ev) => { (EVENTS[date] = EVENTS[date] || []).push(ev); };
    DATA.ipos.forEach(p => {
      p.brokers = p.brokers || [];
      byId[p.id] = p;
      if (p.listing) add(p.listing, { p: p, kind: 'listing', o: 0 });
      if (p.refund) add(p.refund, { p: p, kind: 'refund', o: 1 });
      if (p.sub) { add(p.sub[0], { p: p, kind: 'sub1', o: 2 }); add(p.sub[1], { p: p, kind: 'sub2', o: 3 }); }
    });
    Object.keys(EVENTS).forEach(k => EVENTS[k].sort((a, b) => a.o - b.o));
    dataMonths = Array.from(new Set(DATA.ipos.filter(p => p.sub).map(p => ymOf(p.sub[0])))).sort();
  }
  rebuild();

  /* ---- state ---- */
  const today = kstToday();
  const todayP = parts(today);
  function homeMonth() {
    const k = todayP.y + '-' + pad(todayP.m);
    const use = dataMonths.indexOf(k) >= 0 || !dataMonths.length ? k : dataMonths[dataMonths.length - 1];
    const a = use.split('-').map(Number);
    return { y: a[0], m: a[1] };
  }
  const state = Object.assign({ broker: null, visible: { sub: true, lst: true, spc: true, ref: false } }, homeMonth());
  let lastFocus = null;

  /* ---- helpers ---- */
  function monthIpos(y, m) {
    const k = y + '-' + pad(m);
    return DATA.ipos.filter(p => p.sub && ymOf(p.sub[0]) === k);
  }
  function tone(p) {
    if (p.price == null) return '';
    if (p.tone) return p.tone;
    if (p.band) return p.price >= p.band[1] ? 'up' : (p.price <= p.band[0] ? 'down' : '');
    return '';
  }
  function position(p) {
    if (!p.band || p.price == null) return '';
    const lo = p.band[0], hi = p.band[1];
    if (p.price > hi) return '밴드 상단 초과';
    if (p.price === hi) return '밴드 상단';
    if (p.price < lo) return '밴드 하단 미만';
    if (p.price === lo) return '밴드 하단';
    return '밴드 안';
  }
  function priceHtml(p) {
    if (p.price != null) return '<span class="px fix ' + tone(p) + '">' + fmt(p.price) + '</span>';
    if (p.band) return '<span class="px band">' + fmt(p.band[0]) + '–<wbr>' + fmt(p.band[1]) + '</span>';
    return '';
  }
  function priceText(p) {
    if (p.price != null) return '확정 공모가 ' + fmt(p.price) + '원';
    if (p.band) return '희망 공모가 ' + fmt(p.band[0]) + '원에서 ' + fmt(p.band[1]) + '원';
    return '';
  }

  /* 계좌개설 'N영업일 전'·'직전 영업일' 은 영업일로, '전일' 은 달력상 하루 전으로 실제 날짜를 계산한다. 한국거래소 휴장일(2026년 전체 + 2027-01-01)을 확인해 둔 기간(~2027-01-31)만 계산한다. */
  const KRX_OFF = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-02-18', '2026-03-02', '2026-05-01', '2026-05-05', '2026-05-25', '2026-06-03', '2026-07-17', '2026-08-17', '2026-09-24', '2026-09-25', '2026-10-05', '2026-10-09', '2026-12-25', '2026-12-31', '2027-01-01'];
  function acctDate(p, txt) {
    if (txt === '전일' && p.sub && p.sub[0]) {   /* '영업일' 이란 말이 없는 '전일' 은 달력상 하루 전(주말·공휴일 포함) */
      const d1 = new Date(Date.parse(p.sub[0] + 'T00:00:00Z') - DAY);
      return ' (' + (d1.getUTCMonth() + 1) + '/' + d1.getUTCDate() + ')';
    }
    const m = /^(\d+)영업일 전$/.exec(txt || '') || (txt === '직전 영업일' ? [0, 1] : null);
    const hol = DATA.hol && DATA.hol.dates ? DATA.hol : null, lim = hol && hol.through > '2027-01-31' ? hol.through : '2027-01-31';
    if (!m || !p.sub || !p.sub[0] || p.sub[0] < '2026-01-02' || p.sub[0] > lim) return '';
    let t = Date.parse(p.sub[0] + 'T00:00:00Z'), n = +m[1];
    while (n > 0) {
      t -= DAY;
      const dt = new Date(t), dow = dt.getUTCDay(), iso = dt.toISOString().slice(0, 10);
      const off = KRX_OFF.indexOf(iso) >= 0 || (hol && hol.dates[iso]) || /-12-31$|-05-01$/.test(iso);   // 12/31·5/1 은 공휴일이 아니어도 거래소가 쉰다
      if (dow !== 0 && dow !== 6 && !off) n--;
    }
    const d = new Date(t);
    return ' (' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ')';
  }

  /* ---- calendar ---- */
  const catOf = ev => ev.kind === 'listing' ? 'lst' : ev.kind === 'refund' ? 'ref' : (ev.p.spac ? 'spc' : 'sub');
  
  function chipHtml(it, dimmed) {
    const ev = it.ev, p = ev.p;
    const k = catOf(ev);
    const tag = { lst: '상', ref: '환', sub: '청', spc: '청' }[k];
    const br = p.brokers.join('/');
    const label = it.span === 2 ? '청약 1일차와 2일차' : { listing: '상장', refund: '환불', sub1: '청약 첫째 날', sub2: '청약 둘째 날' }[ev.kind];
    /* stacked as before: name, brokers, price. A bar holds three lines; the name takes what the others leave. */
    const lines = [];
    if (ev.kind === 'sub2') {
      lines.push('<span class="ln">2일차</span>');
    } else {
      if (br) lines.push('<span class="ln">' + esc(br) + '</span>');
      if (ev.kind !== 'refund') { const px = priceHtml(p); if (px) lines.push(px); }
    }
    const nl = Math.max(1, 3 - lines.length);
    const inner = '<span class="nm" style="--nl:' + nl + '"><span class="tag">' + tag + '</span>' + esc(p.name) + '</span>' + lines.join('');
    const cls = 'chip k-' + k + (p.withdrawn ? ' wd' : '') + (ev.kind === 'listing' && p.listingEst ? ' est' : '') + (ev.kind === 'sub2' ? ' sub2' : '') + (it.span === 2 ? ' span' : '') + (it.past ? ' past' : '') + (dimmed ? ' dim' : '');
    const style = 'grid-column:' + (it.col + 1) + (it.span === 2 ? ' / span 2' : '') + ';grid-row:' + (it.row + 2);
    const aria = p.name + ' ' + label + (br ? ', ' + br : '') + (ev.kind !== 'refund' && priceText(p) ? ', ' + priceText(p) : '');
    return '<button type="button" class="' + cls + '" style="' + style + '" data-ipo="' + esc(p.id) + '" aria-label="' + esc(aria) + '">' + inner + '</button>';
  }

  /* One week = one grid. Rows are shared by all five days, so a subscription that spans
     two days sits on the same row in both and is drawn as a single bar. */
  function weekHtml(w, m) {
    const ds = [0, 1, 2, 3, 4].map(i => w + i * DAY);
    const evs = ds.map(t => (EVENTS[isoOf(t)] || []).filter(ev => state.visible[catOf(ev)]));
    const spanned = (ev, i) => ev.kind === 'sub1' && i < 4 && ev.p.sub[1] === isoOf(ds[i + 1]);
    const consumed = (ev, i) => ev.kind === 'sub2' && i > 0 && ev.p.sub[0] === isoOf(ds[i - 1]);
    const rows = [[], [], [], [], []];
    const items = [];
    let n = 0;
    evs.forEach((list, i) => {
      list.filter(ev => !spanned(ev, i) && !consumed(ev, i)).forEach((ev, r) => {
        rows[i][r] = 1; n = Math.max(n, r + 1);
        items.push({ ev: ev, col: i, span: 1, row: r, past: ds[i] < today });
      });
    });
    evs.forEach((list, i) => {
      list.filter(ev => spanned(ev, i)).forEach(ev => {
        let r = 0;
        while (rows[i][r] || rows[i + 1][r]) r++;
        rows[i][r] = 1; rows[i + 1][r] = 1; n = Math.max(n, r + 1);
        items.push({ ev: ev, col: i, span: 2, row: r, past: ds[i + 1] < today });
      });
    });
    let h = '<div class="week" style="grid-template-rows:auto ' + (n ? 'repeat(' + n + ',var(--row)) ' : '') + 'minmax(3px,1fr)">';
    ds.forEach((t, i) => {
      h += '<div class="cb' + (parts(t).m === m ? '' : ' out') + (t === today ? ' today' : '') + '" style="grid-column:' + (i + 1) + ';grid-row:1/-1"></div>';
    });
    ds.forEach((t, i) => {
      const p = parts(t);
      const inM = p.m === m;
      h += '<div class="dn' + (inM ? '' : ' out') + (t === today ? ' today' : '') + '" style="grid-column:' + (i + 1) + '"><b>' + (inM ? p.d : p.m + '/' + p.d) + '</b></div>';
    });

  function weeksHtml(y, m) {
    let first = Date.UTC(y, m - 1, 1);
    while ([0, 6].indexOf(parts(first).w) >= 0) first += DAY;
    const start = first - ((parts(first).w + 6) % 7) * DAY;
    let last = Date.UTC(y, m, 0);
    while ([0, 6].indexOf(parts(last).w) >= 0) last -= DAY;
    const end = last - ((parts(last).w + 6) % 7) * DAY;
    let html = '';
    for (let w = start; w <= end; w += 7 * DAY) html += weekHtml(w, m);
    return html;
  }

  /* ---- fit: scale the page to the window at the zoom it loaded at.
     Browser zoom afterwards enlarges it (the page then scrolls); resizing the window refits it.
     Wide windows scale the whole page. Phones (< 700px) keep the controls at real size and scale only the calendar,
     choosing its design width so it fills the screen edge to edge. ---- */
  const DW = 900, DW_MIN = 470, MOB_MAX = 700, CHROME_REF = 120, TAIL_MIN = 36;
  let dpr0 = 0, baseSc = 1, baseDW = 600, mobBase = false;
  function fit(rebase) {
    const wrap = $('wrap'), stage = $('stage'), cstage = $('calstage'), cscale = $('calscale'), root = document.documentElement;
    const dpr = window.devicePixelRatio || 1;
    if (!dpr0) dpr0 = dpr;
    const k = dpr / dpr0;
    const mob = root.clientWidth * k < MOB_MAX;
    root.classList.toggle('mob', mob);
    /* phones: footer, install button and scroll room sit below the calendar, outside #wrap, so they don't take part in the fit */
    const below = $('below'), foot = document.querySelector('.foot'), tailEl = $('tail');
    if (mob && foot.parentNode === wrap) { below.appendChild(foot); below.appendChild(tailEl); }
    else if (!mob && foot.parentNode === below) { wrap.appendChild(foot); wrap.appendChild(tailEl); }
    const cs = getComputedStyle(document.body);
    const px = v => parseFloat(v) || 0;
    const availW = root.clientWidth * k - px(cs.paddingLeft) - px(cs.paddingRight);
    const availH = window.innerHeight * k - px(cs.paddingTop) - px(cs.paddingBottom);

    if (!mob) {
      /* PC: title, buttons and footer keep their real size at a fixed width; only the calendar scales so the month fits the window height at the zoom the page loaded at (browser zoom afterwards enlarges it and the page scrolls) */
      root.classList.remove('compact'); $('tail').style.height = '0px';
      wrap.style.transform = ''; stage.style.height = '';
      const W = Math.max(DW_MIN, Math.min(DW, root.clientWidth - px(cs.paddingLeft) - px(cs.paddingRight)));
      stage.style.width = W + 'px'; wrap.style.width = W + 'px';
      cstage.style.height = '0px'; cscale.style.transform = ''; cscale.style.width = W + 'px';
      const chrome = wrap.offsetHeight;
      const room = window.innerHeight * k - px(cs.paddingTop) - px(cs.paddingBottom) - chrome - 1;
      let sc = Math.max(0.4, Math.min(1, room / (cscale.offsetHeight || 1)));
      for (let i = 0; i < 2; i++) {
        cscale.style.width = (W / sc) + 'px';
        const h = cscale.offsetHeight || 1;
        if (h * sc > room && sc > 0.4) sc = Math.max(0.4, room / h);
      }
      cscale.style.width = (W / sc) + 'px';
      cscale.style.transform = 'scale(' + sc + ')';
      cstage.style.height = Math.ceil(cscale.offsetHeight * sc) + 'px';
      return;
    }

    wrap.style.width = '';
    wrap.style.transform = ''; stage.style.width = ''; stage.style.height = '';
    const y0 = window.scrollY;
    $('tail').style.height = '0px';
    if (!mobBase && rebase !== true) rebase = true;
    cstage.style.height = '0px';
    cscale.style.width = baseDW + 'px';
    const measure = () => {
      const chrome = root.classList.contains('compact') ? wrap.offsetHeight : Math.max(wrap.offsetHeight, CHROME_REF);
      const h = window.innerHeight * k - px(cs.paddingTop) - px(cs.paddingBottom);   /* read now: padding changes with the compact class */
      return Math.max(0.1, (h - chrome - 1) / (cscale.offsetHeight || 1));
    };
    /* the blogger's calendar text is about 1.3% of its width (17px on a 1320px image): keep ours at least that large */
    const need = (availW * 17 / 1320) / 12.5;
    if (rebase === true) root.classList.remove('compact');
    let scH = measure();
    if (rebase === true && scH < need) { root.classList.add('compact'); scH = measure(); }
    const wide = Math.min(1600, Math.max(DW_MIN, availW / scH));
    const fitSc = Math.min(availW / wide, scH);
    if (rebase === true) { baseSc = fitSc; baseDW = wide; mobBase = true; }
    let sc = baseSc, dw = baseDW;
    if (fitSc < baseSc) { sc = fitSc; dw = wide; }
    cscale.style.width = dw + 'px';
    cscale.style.transform = 'scale(' + sc + ')';
    cstage.style.height = Math.ceil(cscale.offsetHeight * sc) + 'px';

    /* The first screen holds the whole calendar. Below the footer there is extra room, just enough
       to scroll the calendar up to the middle of the screen for comfortable reading. */
    const cr = cstage.getBoundingClientRect();
    const toMid = cr.top + window.scrollY + cr.height / 2 - window.innerHeight / 2;
    $('tail').style.height = Math.max(TAIL_MIN, Math.ceil(window.innerHeight + toMid - root.scrollHeight)) + 'px';
    if (y0) window.scrollTo(0, y0);
  }

      const one = (b, n, req, eqp, A) => { if (!A || !n || req == null || eqp == null || eqp > A) return null; const pp = A - eqp; return [b, eqp / n, req > A ? (pp > 0 ? req / pp : null) : 1]; };

      if (p.ext && p.ext.alloc && p.ext.alloc[b] != null) {
        const tot = Object.values(p.ext.alloc).reduce((a, c) => a + c, 0);
        r += '<dt>배정 수량</dt><dd>' + fmt(p.ext.alloc[b]) + '주' + (Object.keys(p.ext.alloc).length > 1 ? '<span class="sh">' + Math.round(p.ext.alloc[b] / tot * 100) + '%</span>' : '') + '</dd>';
      }
      if (p.acct && p.acct[b]) r += '<dt>계좌개설</dt><dd>청약 ' + esc(p.acct[b]) + acctDate(p, p.acct[b]) + '</dd>';
      if (p.fee && p.fee[b]) r += '<dt>청약수수료</dt><dd>' + fmt(p.fee[b]) + '원</dd>';
      if (r) { covered++; cards += '<div class="bk"><div class="bn">' + esc(BN[b] || (b + '증권')) + '</div><dl>' + r + '</dl></div>'; }
    });
    if (covered < p.brokers.length || !p.brokers.length) h += row('주관사', p.brokers.length ? esc(p.brokers.join(' · ')) : '정보 없음');
    if (p.price != null) {
      const pos = position(p);
      h += row('공모가', '<span class="big ' + tone(p) + '">' + fmt(p.price) + '원</span><small>확정' + (pos ? ' · ' + pos : '') + '</small>' +
        (p.band ? '<small>희망 밴드 ' + fmt(p.band[0]) + '–' + fmt(p.band[1]) + '원</small>' : ''));
    } else if (p.band) {
      h += row('공모가', '<span class="big">' + fmt(p.band[0]) + '–' + fmt(p.band[1]) + '원</span><small>희망 밴드 · 확정 전</small>');
    } else {
      h += row('공모가', '정보 없음');
    }
    h += row('청약', p.sub ? longDate(p.sub[0]) + ' ~ ' + longDate(p.sub[1]) : '이 달 일정에 없음');
    h += row('환불', p.refund ? longDate(p.refund) : '—');
    h += row('상장', p.listing ? longDate(p.listing) + (p.listingEst ? '<small>예상일 · 거래소 공지 전</small>' : '') : (p.sub ? '미정' : '—'));
    $('sheetBody').innerHTML = h;
    $('sheetCards').innerHTML = cards ? '<div class="sec"><h4>증권사별 청약 정보</h4>' + cards + '<p class="note">계좌개설은 비대면, 수수료는 온라인 청약 기준이에요. 수수료는 등급별로 면제될 수 있어요. 공시 기준 참고용이라 청약 전 증권사 앱에서 확인하세요.</p></div>' : '';
    const xh = extHtml(p, BN);
    $('sheetFin').innerHTML = xh.fin;
    $('sheetExt').innerHTML = xh.rest;
    $('scrim').hidden = false;
    $('sheet').hidden = false;
    $('sheet').scrollTop = 0;
    setSheetState('mid', false);
    if (!sheetPushed) { try { history.pushState({ sheet: 1 }, ''); sheetPushed = true; } catch (_) {} }
    $('sheetClose').focus();
  }
  function closeSheet(fromPop) {
    $('scrim').hidden = true;
    $('sheet').hidden = true;
    $('sheet').classList.remove('snap');
    $('sheet').style.transform = '';
    if (sheetPushed) {   // 열 때 쌓아 둔 기록을 걷어낸다(뒤로가기로 닫힌 경우는 이미 걷혔다)
      sheetPushed = false;
      if (fromPop !== true) { pendingBack++; try { history.back(); } catch (_) { pendingBack--; } }
    }
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  /* ---- 폰: 상세창은 처음엔 화면의 2/3, 위로 밀면 크게, 크게 연 상태에서 맨 위일 때 아래로 밀면 닫힘. 뒤로가기는 상세창만 닫음 ---- */
  let sheetPushed = false, pendingBack = 0, sstate = 'mid', sg = null;
  const phoneSheet = () => window.matchMedia('(max-width: 639px)').matches;
  const midH = () => Math.round(window.innerHeight * 0.64), fullH = () => Math.round(window.innerHeight * 0.95);
  function setSheetState(st, animate) {
    const sh = $('sheet');
    sstate = st;
    if (!phoneSheet()) { sh.style.height = ''; sh.style.transform = ''; return; }
    if (animate) { sh.classList.add('snap'); setTimeout(() => sh.classList.remove('snap'), 280); }
    sh.style.height = (st === 'full' ? fullH() : midH()) + 'px';
    sh.style.transform = '';
  }
  function dismissSheet() {
    const sh = $('sheet');
    sh.classList.add('snap');
    sh.style.transform = 'translateY(100%)';
    setTimeout(() => closeSheet(), 240);
  }
  window.addEventListener('popstate', () => {
    if (pendingBack > 0) { pendingBack--; return; }
    if (!$('sheet').hidden) { sheetPushed = false; closeSheet(true); }
  });
  (function () {
    const sh = $('sheet');
    sh.addEventListener('touchstart', e => {
      if (!phoneSheet() || e.touches.length !== 1 || zoomed()) { sg = null; return; }
      const t = e.touches[0];
      const r0 = sh.getBoundingClientRect();
      sg = { x: t.clientX, y: t.clientY, top: sh.scrollTop, mode: null, t: Date.now(), dy: 0, handle: t.clientY - r0.top < 30, h0: r0.height };
    }, { passive: true });
    sh.addEventListener('touchmove', e => {
      if (!sg) return;
      const t = e.touches[0], dx = t.clientX - sg.x, dy = t.clientY - sg.y;
      if (!sg.mode) {
        if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
        if (Math.abs(dx) > Math.abs(dy)) { sg = null; return; }   // 영상 줄 같은 가로 스크롤은 건드리지 않는다
        if (sg.handle) sg.mode = 'handle';   // 손잡이는 어느 상태에서든 창을 잡고 끌 수 있다
        else if (sstate === 'mid') sg.mode = dy < 0 ? 'up' : 'down';
        else sg.mode = (dy > 0 && sg.top <= 0 && sh.scrollTop <= 0) ? 'down' : 'scroll';
      }
      if (sg.mode === 'scroll') return;
      if (e.cancelable) e.preventDefault();
      sg.dy = dy;
      if (sg.mode === 'handle') {
        const want = sg.h0 - dy, h = Math.max(midH(), Math.min(fullH(), want));
        sh.style.height = h + 'px';
        sh.style.transform = want < midH() ? 'translateY(' + (midH() - want) + 'px)' : '';
      } else if (sg.mode === 'up') sh.style.height = Math.max(midH(), Math.min(fullH(), midH() - dy)) + 'px';
      else sh.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
    }, { passive: false });
    const end = cancel => {
      if (sg && sg.handle && !sg.mode && !cancel && Date.now() - sg.t < 400) { sg = null; setSheetState(sstate === 'mid' ? 'full' : 'mid', true); return; }   // 막대를 톡 누르면 크기 전환
      if (!sg || !sg.mode || sg.mode === 'scroll') { sg = null; return; }
      if (sg.mode === 'handle') {
        const dy = sg.dy, want = sg.h0 - dy, c = cancel;
        sg = null;
        if (!c && want < midH() * 0.6) { dismissSheet(); return; }
        setSheetState(c ? sstate : (dy < -30 ? 'full' : dy > 30 ? 'mid' : (want > (midH() + fullH()) / 2 ? 'full' : 'mid')), true);
        return;
      }
      const dy = sg.dy, v = Math.abs(dy) / Math.max(1, Date.now() - sg.t), m = sg.mode;
      sg = null;
      if (m === 'up') setSheetState(!cancel && (-dy > 50 || (v > 0.5 && -dy > 20)) ? 'full' : 'mid', true);
      else if (!cancel && (dy > 90 || (v > 0.6 && dy > 30))) dismissSheet();
      else setSheetState(sstate, true);
    };
    sh.addEventListener('touchend', () => end(false), { passive: true });
    sh.addEventListener('touchcancel', () => end(true), { passive: true });
  })();

  /* ---- alerts (bell): schedule changes / withdrawals on one tab, newly confirmed info on the other ---- */
  const SEEN_KEY = 'ipo-noti-seen';
  let seen = { chg: '', new: '' };
  try { const j = JSON.parse(localStorage.getItem(SEEN_KEY) || 'null'); if (j) seen = Object.assign(seen, j); } catch (e) {}
  function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} }
  const allChanges = () => (DATA.changes || []).slice().sort((a, b) => a.t < b.t ? 1 : -1);
  function isUnseen(c) {
    const s = seen[c.tab];
    if (s) return c.t > s;
    return Date.now() - Date.parse(c.t + ':00+09:00') < 3 * 86400000;   // first visit: the last three days count as new
  }
  const unseenIn = tab => allChanges().filter(c => c.tab === tab && isUnseen(c));
  function updateBell() {
    const has = unseenIn('chg').length + unseenIn('new').length > 0;
    $('bell').hidden = !DATA.live;
    $('bellDot').hidden = !has;
    $('bell').setAttribute('aria-label', '알림' + (has ? ', 확인하지 않은 알림 있음' : ''));
  }
  let notiTab = 'chg';
  function renderNoti() {
    const fresh = unseenIn(notiTab);
    const freshKeys = new Set(fresh.map(c => c.id + '|' + c.text));
    document.querySelectorAll('.tab').forEach(t => {
      const k = t.getAttribute('data-tab');
      t.setAttribute('aria-selected', String(k === notiTab));
      t.querySelector('.tdot').hidden = !(k !== notiTab && unseenIn(k).length);
    });
    const list = allChanges().filter(c => c.tab === notiTab);
    $('nlist').innerHTML = list.length ? list.map(c => {
      const when = Number(c.t.slice(5, 7)) + '/' + Number(c.t.slice(8, 10)) + ' ' + c.t.slice(11, 16);
      const inner = '<span class="nt">' + esc(when) + '</span><span class="nn">' + esc(c.name) + '</span><span class="nx">' + esc(c.text) + '</span>';
      const cls = 'nitem' + (freshKeys.has(c.id + '|' + c.text) ? ' unseen' : '');
      return '<li>' + (byId[c.id] ? '<button type="button" class="' + cls + '" data-nid="' + esc(c.id) + '">' + inner + '</button>' : '<div class="' + cls + ' static">' + inner + '</div>') + '</li>';
    }).join('') : '<li class="nempty">' + (notiTab === 'chg' ? '바뀐 일정이 아직 없어요.' : '새로 확정된 정보가 아직 없어요.') + '</li>';
    if (list.length) { seen[notiTab] = list[0].t; saveSeen(); }
    updateBell();
  }
  function openNoti() {
    notiTab = 'chg';
    renderNoti();
    $('scrim').hidden = false;
    $('noti').hidden = false;
    $('notiClose').focus();
  }
  function closeNoti(skipFocus) {
    $('noti').hidden = true;
    if ($('sheet').hidden) $('scrim').hidden = true;
    if (!skipFocus) $('bell').focus();
  }

  /* ---- events ---- */
  function slide(dir) {
    const w = $('weeks');
    w.classList.remove('in-l', 'in-r');
    void w.offsetWidth;
    w.classList.add(dir === 'l' ? 'in-l' : 'in-r');
  }
  function shift(n, dir) {
    const t = Date.UTC(state.y, state.m - 1 + n, 1);
    const p = parts(t);
    state.y = p.y; state.m = p.m; state.touched = true;
    render();
    if (dir) slide(dir);
  }
  document.addEventListener('click', e => {
    const chip = e.target.closest('[data-ipo]');
    if (chip) { openSheet(chip.getAttribute('data-ipo'), chip); return; }
    const key = e.target.closest('[data-cat]');
    if (key) {
      const c = key.getAttribute('data-cat');
      state.visible[c] = !state.visible[c];
      render();
      const back = document.querySelector('[data-cat="' + c + '"]');
      if (back) back.focus();
      return;
    }
    const pill = e.target.closest('[data-broker]');
    if (pill) {
      const b = pill.getAttribute('data-broker');
      state.broker = state.broker === b ? null : b;
      render();
      const again = document.querySelector('[data-broker="' + b + '"]');
      if (again) again.focus();
    }
  });
  $('prev').addEventListener('click', () => shift(-1, 'r'));
  $('next').addEventListener('click', () => shift(1, 'l'));
  $('todayBtn').addEventListener('click', () => { const h = homeMonth(); state.y = h.y; state.m = h.m; render(); });
  $('scrim').addEventListener('click', () => { closeSheet(); closeNoti(true); });
  $('bell').addEventListener('click', openNoti);
  $('notiClose').addEventListener('click', () => closeNoti());
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { notiTab = t.getAttribute('data-tab'); renderNoti(); }));
  $('nlist').addEventListener('click', e => {
    const b = e.target.closest('[data-nid]');
    if (!b) return;
    const id = b.getAttribute('data-nid'), p = byId[id];
    closeNoti(true);
    if (p && p.sub) { const a = p.sub[0].split('-'); state.y = Number(a[0]); state.m = Number(a[1]); state.touched = true; render(); }
    openSheet(id, $('bell'));
  });
  $('sheetClose').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('noti').hidden) closeNoti(); else if (!$('sheet').hidden) closeSheet(); });

  /* swipe left / right to change month (phone layout only) */
  let sw = null;
  /* While the page is pinch-zoomed the browser takes the drag and pans the view, so no month swipe arrives.
     Where the zoom can be read (visualViewport) swipes are also ignored outright. */
  function zoomed() {
    const vv = window.visualViewport;
    return !!vv && Math.abs(vv.scale - 1) > 0.01;
  }
  document.addEventListener('touchstart', e => {
    const root = document.documentElement;
    if (zoomed() || !root.classList.contains('mob') || e.touches.length !== 1 || !$('sheet').hidden || !$('noti').hidden || (e.target.closest && e.target.closest('.pills'))) { sw = null; return; }
    const t = e.touches[0];
    sw = { x: t.clientX, y: t.clientY, at: Date.now() };
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!sw || zoomed()) { sw = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.at;
    sw = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < 700) shift(dx < 0 ? 1 : -1, dx < 0 ? 'l' : 'r');
  }, { passive: true });
  document.addEventListener('touchcancel', () => { sw = null; }, { passive: true });

  render();
  updateBell();

  /* Live data: the collector writes data/ipo.json next to this page. If it is missing or
     malformed (e.g. this preview), the sample data above stays on screen. */
  function loadLive() {
    if (!window.fetch || location.protocol === 'file:') return;
    fetch('data/ipo.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(j => {
        if (!j || !Array.isArray(j.ipos) || !j.ipos.length || !j.updatedAt) return;
        DATA = { updatedAt: j.updatedAt, ipos: j.ipos, live: true, changes: Array.isArray(j.changes) ? j.changes : [], hol: j.holidays || null };
        updateBell();
        rebuild();
        const h = homeMonth();
        if (!state.touched) { state.y = h.y; state.m = h.m; }
        render();
        /* last time the collector ran (it only rewrites ipo.json when data changed) */
        return fetch('data/checked.json?t=' + Date.now(), { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null)
          .then(c => {
            if (c && typeof c.checkedAt === 'string' && c.checkedAt >= DATA.updatedAt) { DATA.checkedAt = c.checkedAt; render(); }
          })
          .catch(() => {});
      })
      .catch(() => {});
  }
  loadLive();

  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadLive(); });
  /* phones: scrolling shows/hides the browser's address bar, which fires 'resize' with only the height changed.
     Refitting then made the calendar change size while scrolling, so height-only changes on touch devices are ignored. */
  let lastW = document.documentElement.clientWidth;
  window.addEventListener('resize', () => {
    const w = document.documentElement.clientWidth, touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (touch && w === lastW && document.documentElement.classList.contains('mob')) return;
    lastW = w;
    fit(true);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(true));
})();
</script>

</body>
</html>
